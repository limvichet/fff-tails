name: Build and Deploy

on: 
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: 
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          # Required when using a custom token to avoid auth conflicts
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          # This fixes your "No pnpm version specified" error
          version: 9

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install & Generate 🔧
        run: |
          pnpm install --frozen-lockfile
          pnpm generate
        env:
          NUXT_APP_BASE_URL: ${{ vars.NUXT_APP_BASE_URL }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # Pointing directly to Nuxt's default output folder
          folder: .output/public
          repository-name: limvichet/fff-tails
          branch: gh-pages
          token: ${{ secrets.FFF_DEPLOY_TOKEN }}